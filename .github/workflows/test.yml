name: tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies for build
        run: npm ci

      - name: Build
        run: npm run build

  frontend-playwright:
    name: Frontend playwright tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies for build
        run: npm ci

      - name: Install Playwright for dev testing
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run playwright

  frontend-eslint:
    name: Frontend linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies for build
        run: npm ci

      - name: Lint
        # we don't care about errors, hence eslint-quiet
        run: npm run lint-quiet

  python-backends:
    name: ${{ matrix.backend }} Python smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        backend: [base-pi, server]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BACKEND: ${{ matrix.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.backend }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${{ matrix.backend }}/requirements.txt"

      - name: Compile
        run: python -m compileall "${{ matrix.backend }}"

      - name: Smoke run (offline)
        shell: python
        run: |
          import os
          import socket
          import subprocess
          import sys
          import time

          backend = os.environ["BACKEND"]
          port = 4000 if backend == "server" else 4001
          command = [
              sys.executable,
              "-u",
              f"{backend}/py_server.py",
              "--offline",
          ]

          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )

          ready = False
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              if process.poll() is not None:
                  break

              try:
                  with socket.create_connection(
                      ("127.0.0.1", port), timeout=0.5
                  ):
                      ready = True
                      break
              except OSError:
                  time.sleep(0.2)

          # Make sure the backend remains alive after it starts listening.
          if ready:
              time.sleep(1)

          returncode = process.poll()
          if returncode is None:
              process.terminate()
              try:
                  output, _ = process.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  output, _ = process.communicate()
          else:
              output, _ = process.communicate()

          print(output)

          if not ready:
              raise SystemExit(
                  f"{backend} did not listen on port {port}; "
                  f"exit code: {returncode}"
              )

          if returncode is not None:
              raise SystemExit(
                  f"{backend} crashed after startup with code {returncode}"
              )
